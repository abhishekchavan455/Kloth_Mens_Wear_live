<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Expense Tracker</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(to right, #f0f2f5, #dfe6e9);
            margin: 0;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        
        #expenseForm {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }
        
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
        }
        
        input[type="text"],
        input[type="number"],
        input[type="date"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        
        .form-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: 0.3s ease;
        }
        
        button[type="submit"] {
            background-color: #34495e;
            color: white;
        }
        
        button[type="submit"]:hover {
            background-color: #2554a3;
        }
        
        button[type="reset"] {
            background-color: #34495e;
            color: white;
        }
        
        button[type="reset"]:hover {
            background-color: #2554a3;
        }
        
        @media (max-width: 480px) {
            .form-group {
                flex-direction: column;
            }
            button {
                width: 100%;
                margin-top: 10px;
            }
        }
    </style>
</head>

<body>

    <h1>Daily Shop Expense Tracker</h1>

    <form id="expenseForm" action="add_shop_expenses.php" method="POST">
        <label for="expenseName">Personal Expense</label>
        <input type="text" name="expenseName" id="expenseName" placeholder="Enter expense description" required>

        <label for="cash">Cash Amount</label>
        <input type="number" name="cash" id="cash" placeholder="Enter Cash Amount" required>

        <label for="gpay">GPay Amount</label>
        <input type="number" name="gpay" id="gpay" placeholder="Enter GPay Amount" required>

        <label for="total_amount">Total Amount</label>
        <input type="number" name="total_amount" id="total_amount" placeholder="Enter Total Amount" required>

        <label for="expenseDate">Expense Date</label>
        <input type="date" name="expenseDate" id="expenseDate" required>

        <div class="form-group">
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </div>
    </form>

</body>

</html>
