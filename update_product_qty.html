<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Product Quantity</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: url("kloth-high-resolution-logo.png") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .card {
            background-color: rgba(255, 255, 255, 0.95);
            border: 2px solid #3366cc;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
        
        .title {
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            color: #3366cc;
            margin-bottom: 25px;
        }
        
        .form {
            display: flex;
            flex-direction: column;
        }
        
        .group {
            position: relative;
            margin-bottom: 25px;
        }
        
        .group input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background-color: #fdfdfd;
            outline: none;
        }
        
        .group input:focus {
            border-color: #3366cc;
            box-shadow: 0 0 4px rgba(51, 102, 204, 0.5);
        }
        
        .group label {
            position: absolute;
            top: -10px;
            left: 10px;
            background-color: #fff;
            padding: 0 6px;
            font-size: 14px;
            color: #3366cc;
            font-weight: 600;
        }
        
        .form-submit-btn {
            padding: 12px;
            font-size: 16px;
            color: white;
            background-color: #3366cc;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }
        
        .form-submit-btn:hover {
            background-color: #254e9b;
        }
        
        .form-submit-btn[type="reset"] {
            background-color: #888;
        }
        
        .form-submit-btn[type="reset"]:hover {
            background-color: #666;
        }
    </style>
</head>

<body>

    <div class="card">
        <span class="title">Update Product Quantity</span><br><br>
        <form class="form" action="update_product_qty.php" method="GET">

            <div class="group">
                <input type="text" name="product_id" required placeholder="">
                <label>Product ID</label>
            </div>

            <div class="group">
                <input type="text" name="qty" required placeholder="">
                <label>Product Quantity</label>
            </div>

            <input type="submit" value="Submit" class="form-submit-btn">
            <input type="reset" value="Reset" class="form-submit-btn">
        </form>
    </div>

</body>

</html>
