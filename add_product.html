<!DOCTYPE html>
<html>

<head>
    <title>Add Product</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ecf0f1, #e0eafc);
            color: #1f1f1f;
        }
        
        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }
        
        .form {
            background: #fff;
            padding: 25px;
            border: 2px solid #34495e;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(8, 6, 6, 0.1);
        }
        
        h2.title {
            text-align: center;
            background-color: #34495e;
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-size: 30px;
            margin-bottom: 25px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        
        .form-group button {
            padding: 10px 20px;
            background-color: #34495e;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
        }
        
        .form-group button:hover {
            background-color: #2554a3;
        }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #ecf0f1, #e0eafc);
            color: #1f1f1f;
        }
    </style>
</head>

<body>
    <div class="container">
        <form action="add_product.php" method="post" enctype="multipart/form-data" class="form">
            <h2 class="title">Add New Product</h2>

            <div class="form-group">
                <label>Product Name</label>
                <input type="text" name="productname" required>
            </div>

            <div class="form-group">
                <label>Product Price</label>
                <input type="number" name="price" required>
            </div>

            <div class="form-group">
                <label>Product Quantity</label>
                <input type="number" name="qty" required>
            </div>

            <div class="form-group">
                <label>Type</label>
                <input type="text" name="type" required>
            </div>

            <div class="form-group">
                <label>Category</label>
                <select name="category" required>
                    <option value="">-- Select Category --</option>
                    <option value="Shirt">Shirt</option>
                    <option value="Pant">Pant</option>
                    <option value="T-Shirt">T-Shirt</option>
                </select>
            </div>

            <div class="form-group">
                <label>Subcategory</label>
                <input type="text" name="subcategory" required>
            </div>

            <div class="form-group">
                <label>Size Start</label>
                <input type="text" name="sizestart" placeholder="e.g. M or 28" required>
            </div>

            <div class="form-group">
                <label>Size End</label>
                <input type="text" name="sizeend" placeholder="e.g. XXL or 44" required>
            </div>

            <div class="form-group">
                <label>Company Name</label>
                <input type="text" name="companyname" required>
            </div>

            <div class="form-group">
                <label>Purchase Rate</label>
                <input type="number" name="purchaserate" required>
            </div>

            <div class="form-group">
                <label>Printed MRP</label>
                <input type="number" name="printedmrp" required>
            </div>

            <div class="form-group">
                <label>Supplier Name</label>
                <input type="text" name="sname" required>
            </div>

            <div class="form-group">
                <label>Product Image</label>
                <input type="file" name="productImage" accept="image/*" required>
            </div>

            <div class="form-group">
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </div>
        </form>
    </div>
</body>

</html>
