<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Explore Formal Pant</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        body {
            background: linear-gradient(to right, #ecf0f1, #e0eafc);
            color: #1f1f1f;
        }
        
        .product-img {
            max-height: 300px;
            object-fit: cover;
            height: 300px;
            cursor: pointer;
            border-radius: 8px;
        }
        
        .product-title {
            font-size: 1rem;
            font-weight: 600;
        }
        
        .product-price {
            font-weight: bold;
            color: #444;
        }
        
        .product-card {
            border: 1px solid #eee;
            padding: 15px;
            height: 100%;
            transition: all 0.3s ease;
            border-radius: 10px;
            background-color: #fff;
        }
        
        .product-card:hover {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            transform: translateY(-5px);
        }
        
        #modalProductImage {
            transition: transform 0.3s ease-in-out;
            cursor: zoom-in;
            border-radius: 10px;
        }
        
        #modalProductImage:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <section class="container py-5">
        <div class="text-center mb-5">
            <h2 class="fw-bold">Formal Pants Collection</h2>
            <p class="text-muted">Explore our classy formal pants lineup</p>
        </div>

        <div class="row g-4" id="productGrid">
            <!-- Product cards will be injected here -->
        </div>
    </section>

    <!-- Modal -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="productModalLabel">Product Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body d-flex flex-column flex-md-row align-items-center text-center text-md-start">
                    <img id="modalProductImage" src="" class="img-fluid mb-3 mb-md-0 me-md-4" style="max-width: 300px;" />
                    <div>
                        <h4 id="modalProductTitle" class="fw-bold"></h4>
                        <p id="modalProductPrice" class="text-muted fs-5 mb-2"></p>
                        <p id="modalProductDescription" class="text-secondary"></p>
                    </div>
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Product Script -->
    <script>
        const products = [{
            image: "image/formal_pant1.JPG",
            title: "Lykra Dark Gray",
            price: "₹599/-"
        }, {
            image: "image/formal_pant2.JPG",
            title: "Lykra Gray",
            price: "₹599/-"
        }, {
            image: "image/formal_pant3.JPG",
            title: "Lykra Cream",
            price: "₹599/-"
        }, {
            image: "image/formal_pant4.JPG",
            title: "Lykra Black",
            price: "₹599/-"
        }];

        const productGrid = document.getElementById("productGrid");

        products.forEach(product => {
            const productHTML = `
        <div class="col-lg-3 col-md-4 col-sm-6 text-center">
          <div class="product-card">
            <img src="${product.image}" class="img-fluid product-img mb-2"
              onclick="showProductModal('${product.image}', '${product.title}', '${product.price}', 'Premium stretchable Lykra formal pant perfect for office & occasions.')" />
            <h3 class="product-title">${product.title}</h3>
            <p class="product-price">${product.price}</p>
          </div>
        </div>
      `;
            productGrid.innerHTML += productHTML;
        });

        function showProductModal(imageSrc, title, price, description) {
            document.getElementById('modalProductImage').src = imageSrc;
            document.getElementById('modalProductTitle').textContent = title;
            document.getElementById('modalProductPrice').textContent = price;
            document.getElementById('modalProductDescription').textContent = description;

            const modal = new bootstrap.Modal(document.getElementById('productModal'));
            modal.show();
        }
    </script>
</body>

</html>
